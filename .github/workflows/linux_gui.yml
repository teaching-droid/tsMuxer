name: Build GUI for Linux

on:
  push:
    branches: [master]
    paths:
    - 'tsMuxerGUI/**'
    - 'tsMuxer/**'
    - 'libmediation/**'
    - 'CMakeLists.txt'
  pull_request:
    branches: [master]
    paths:
    - 'tsMuxerGUI/**'
    - 'tsMuxer/**'
    - 'libmediation/**'
    - 'CMakeLists.txt'

jobs:
  build-linux-gui:

    # Not ubuntu-latest: a program needs the glibc of the system it is built on or newer, and ubuntu-latest
    # moved to Ubuntu 26 (glibc 2.43), so the Linux programs no longer started on Ubuntu 24.04 or Debian 12.
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v5
      name: checkout

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype-dev zlib1g-dev
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        # No qtmultimedia: its deployment put Qt's FFmpeg plug-in and the FFmpeg libraries into the package, and
        # tsMuxeR ships no FFmpeg. The window plays its end-of-mux sound through the system.
      
    - run: ./.github/workflows/linux_gui.sh
      name: build-linux-gui
