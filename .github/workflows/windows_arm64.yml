name: Build for Windows ARM64

# tsMuxeR.exe and tsMuxerGUI.exe for Windows 11 on ARM64, built and tested on a Windows ARM64 runner.
# Windows 7 has no ARM64 version, so this package needs none of the Windows 7 work of windows_64.yml: Qt is the
# unmodified Qt 6.8.3 for Windows ARM64 of The Qt Company.

on:
  # Lets a build be run by hand against any branch, from the Actions tab. The zip it attaches is how a tester gets a
  # build without a release existing.
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  # A change of this file in a pull request builds and tests the package, without publishing anything.
  pull_request:
    branches: [master]
    paths:
    - '.github/workflows/windows_arm64.yml'
    - 'packaging/notices/Windows-arm64.txt'

permissions:
  contents: write

# The ARM64 packages are built and tested, but not yet published with a release: set this to "true" to publish
# them.
env:
  PUBLISH_ARM64: "false"

jobs:
  build:
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v5
      name: checkout

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: arm64

    - name: Set up MSVC (ARM64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: windows_arm64
        arch: win64_msvc2022_arm64
        # the ARM64 Python set up above, not a second one of the action's own
        setup-python: false
        # No qtmultimedia: its deployment put Qt's FFmpeg plug-in and the FFmpeg libraries into the package, and
        # tsMuxeR ships no FFmpeg.

    - name: Ninja
      run: |
        # Visual Studio's own Ninja is on the path after the MSVC set-up; where it is not, the Python package is used.
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install ninja }
        ninja --version

    # ** LIBASS, FOR ASS AND SSA SUBTITLES. ** As in windows_64.yml: built by vcpkg at the commit
    # packaging/libass/vcpkg.json names, for ARM64.
    - name: Cache libass
      id: cache-libass
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}\libass-dlls
        key: libass-arm64-windows-${{ hashFiles('packaging/libass/**') }}

    - name: Build libass
      if: steps.cache-libass.outputs.cache-hit != 'true'
      run: |
        & "$env:GITHUB_WORKSPACE\packaging\libass\build_libass.ps1" -Triplet arm64-windows -Work "${{ runner.temp }}\libass-work" -Out "${{ runner.temp }}\libass-dlls"
        if (-not $?) { throw "libass build failed" }

    - name: Build zlib (static)
      run: |
        $ErrorActionPreference = "Stop"
        $ZSRC = "${{ runner.temp }}\zlib-src"
        $ZBUILD = "${{ runner.temp }}\zlib-build"
        $ZINST = "${{ runner.temp }}\zlib-install"
        git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git "$ZSRC"
        if ($LASTEXITCODE -ne 0) { throw "zlib clone failed" }
        cmake -S "$ZSRC" -B "$ZBUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ZINST"
        if ($LASTEXITCODE -ne 0) { throw "zlib configure failed" }
        cmake --build "$ZBUILD"
        if ($LASTEXITCODE -ne 0) { throw "zlib build failed" }
        cmake --install "$ZBUILD"
        if ($LASTEXITCODE -ne 0) { throw "zlib install failed" }

    - name: Build tsMuxer
      run: |
        $ErrorActionPreference = "Stop"
        $ZINST = "${{ runner.temp }}\zlib-install"
        mkdir build
        cd build
        cmake ../ `
          -G Ninja `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
          -DZLIB_INCLUDE_DIR="$ZINST\include" `
          -DZLIB_LIBRARY="$ZINST\lib\zlibstatic.lib" `
          -DTSMUXER_GUI=ON `
          -DCMAKE_BUILD_TYPE=Release
        if ($LASTEXITCODE -ne 0) { throw "tsMuxer configure failed" }
        cmake --build .
        if ($LASTEXITCODE -ne 0) { throw "tsMuxer build failed" }
        cd ..
        New-Item -ItemType Directory -Force bin | Out-Null
        Copy-Item "build/tsMuxer/tsmuxer.exe" "bin/tsMuxeR.exe" -Force
        if (-not (Test-Path "build/tsMuxerGUI/tsmuxergui.exe")) { throw "tsMuxerGUI.exe was not built. Refusing to publish a partial package." }
        Copy-Item "build/tsMuxerGUI/tsmuxergui.exe" "bin/tsMuxerGUI.exe" -Force
        # libass beside tsMuxeR.exe; tsMuxeR's license; the notices and license texts of what the package holds
        Copy-Item "${{ runner.temp }}\libass-dlls\*.dll" "bin/" -Force
        Copy-Item "LICENSE" "bin/LICENSE" -Force
        Copy-Item "NOTICE" "bin/NOTICE" -Force
        Copy-Item "packaging/notices/Windows-arm64.txt" "bin/THIRD-PARTY-NOTICES.txt" -Force
        Copy-Item "licenses" "bin/licenses" -Recurse -Force
        # Qt's libraries and plugins beside the window
        & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "bin/tsMuxerGUI.exe"
        if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
        # A QWidget program never loads the Direct3D shader compiler; the network information plugin is not used.
        Remove-Item "bin/dxcompiler.dll","bin/dxil.dll","bin/vc_redist.arm64.exe" -Force -ErrorAction SilentlyContinue
        Remove-Item "bin/networkinformation" -Recurse -Force -ErrorAction SilentlyContinue
        # The window draws no SVG: the SVG library and its plugins, which this Qt brings, are not shipped.
        Remove-Item "bin/Qt6Svg.dll","bin/iconengines/qsvgicon.dll","bin/imageformats/qsvg.dll" -Force -ErrorAction SilentlyContinue
        if ((Test-Path "bin/iconengines") -and -not (Get-ChildItem "bin/iconengines")) { Remove-Item "bin/iconengines" -Force }
        # Only the Qt libraries the notice names (packaging/notices/Windows-arm64.txt) may be in the package.
        $extra = Get-ChildItem "bin" -Filter "Qt6*.dll" | Where-Object { $_.Name -notin @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "Qt6Network.dll") }
        if ($extra) { throw "Qt libraries the notice does not name: $($extra.Name -join ', ')" }
        # ** QT'S OWN STRINGS. ** The standard buttons (Yes, No, Cancel and the rest) come from qtbase_<lang>.qm, which
        # this Qt brings ready made. The name on the left is Qt's, the one on the right what the window asks for: as
        # in windows_64.yml, QTranslator::load shortens a name and never lengthens it.
        $qtLangs = [ordered]@{ "de" = "de"; "ru" = "ru"; "fr" = "fr"; "zh_CN" = "zh"; "he" = "he"; "es" = "es"; "ja" = "ja"; "pt_BR" = "pt_BR"; "it" = "it"; "zh_TW" = "zh_TW"; "ko" = "ko"; "pl" = "pl" }
        foreach ($pair in $qtLangs.GetEnumerator()) {
          $qm = Join-Path "$env:QT_ROOT_DIR\translations" ("qtbase_" + $pair.Key + ".qm")
          if (Test-Path $qm) { Copy-Item $qm ("bin/qtbase_" + $pair.Value + ".qm") -Force }
          else { Write-Host "qtbase_$($pair.Key).qm is not in this Qt, skipping" }
        }
        # The C++ runtime of this build, for ARM64, so the package runs with nothing installed. The Universal C
        # runtime is part of every Windows that runs on ARM64.
        $crt = Get-ChildItem "$env:VCToolsRedistDir\arm64" -Filter "Microsoft.VC*.CRT" -Directory | Select-Object -First 1
        if (-not $crt) { throw "The ARM64 C++ runtime was not found under $env:VCToolsRedistDir\arm64." }
        Copy-Item "$($crt.FullName)\*.dll" "bin/" -Force
        # vccorlib140.dll is the C++/CX runtime: nothing shipped imports it
        Remove-Item "bin/vccorlib140.dll" -Force -ErrorAction SilentlyContinue

    - name: Check the build
      run: |
        $ErrorActionPreference = "Stop"
        # Every program and library of the package is for ARM64: an x64 file would run emulated, or not load at all.
        $bad = @()
        Get-ChildItem -Recurse bin -Include *.exe,*.dll | ForEach-Object {
          $b = [System.IO.File]::ReadAllBytes($_.FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { $bad += "$($_.Name) (machine 0x{0:X4})" -f $machine }
        }
        if ($bad.Count -gt 0) { throw "Not ARM64: $($bad -join ', ')" }
        # Every library a program or library of the package names is beside it or part of Windows.
        $missing = @()
        Get-ChildItem -Recurse bin -Include *.exe,*.dll | ForEach-Object {
          $file = $_
          $deps = dumpbin /nologo /dependents $file.FullName | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          foreach ($d in $deps) {
            if ($d -match '^(api-ms-win-|ext-ms-)') { continue }
            if (Test-Path (Join-Path "bin" $d)) { continue }
            if (Test-Path (Join-Path $file.DirectoryName $d)) { continue }
            if (Test-Path (Join-Path "$env:WINDIR\System32" $d)) { continue }
            $missing += "$($file.Name) -> $d"
          }
        }
        if ($missing.Count -gt 0) { throw "Libraries not found: $($missing -join '; ')" }
        # The command line program starts and names its version.
        $out = & "bin/tsMuxeR.exe" 2>&1 | Out-String
        if ($out -notmatch "tsMuxeR version") { throw "tsMuxeR.exe did not start: $out" }
        ($out -split "`n")[0]
        # A real job: two seconds of silence as a WAV file, to a transport stream.
        $rate = 48000; $ch = 2; $n = 96000
        $data = New-Object byte[] ($n * $ch * 2)
        $ms = New-Object System.IO.MemoryStream
        $w = New-Object System.IO.BinaryWriter $ms
        $w.Write([Text.Encoding]::ASCII.GetBytes("RIFF")); $w.Write([int](36 + $data.Length))
        $w.Write([Text.Encoding]::ASCII.GetBytes("WAVEfmt ")); $w.Write([int]16); $w.Write([int16]1); $w.Write([int16]$ch)
        $w.Write([int]$rate); $w.Write([int]($rate * $ch * 2)); $w.Write([int16]($ch * 2)); $w.Write([int16]16)
        $w.Write([Text.Encoding]::ASCII.GetBytes("data")); $w.Write([int]$data.Length); $w.Write($data)
        New-Item -ItemType Directory -Force job | Out-Null
        [System.IO.File]::WriteAllBytes("$PWD\job\tone.wav", $ms.ToArray())
        [System.IO.File]::WriteAllText("$PWD\job\tone.meta", "MUXOPT --no-pcr-on-video-pid`nA_LPCM, `"tone.wav`"`n")
        Push-Location job
        & "..\bin\tsMuxeR.exe" tone.meta out.ts
        $rc = $LASTEXITCODE
        Pop-Location
        if ($rc -ne 0 -or -not (Test-Path "job\out.ts") -or (Get-Item "job\out.ts").Length -lt 100000) { throw "The job failed (exit code $rc)." }
        # The window starts and is still running after 15 s, and Qt loaded its platform plugin: a plugin that does not
        # load shows a message box and the program stays, so Qt's own log is read for it.
        $env:QT_FORCE_STDERR_LOGGING = "1"
        $env:QT_DEBUG_PLUGINS = "1"
        $p = Start-Process -FilePath "bin\tsMuxerGUI.exe" -PassThru -RedirectStandardError "gui.log" -RedirectStandardOutput "gui_out.log"
        Start-Sleep -Seconds 15
        $exited = $p.HasExited
        if (-not $exited) { Stop-Process -Id $p.Id -Force }
        Start-Sleep -Seconds 1
        $log = (Get-Content "gui.log" -Raw -ErrorAction SilentlyContinue) + (Get-Content "gui_out.log" -Raw -ErrorAction SilentlyContinue)
        Write-Host ($log -split "`n" | Select-Object -Last 20 | Out-String)
        if ($log -match "(?i)could not load the qt platform plugin|no qt platform plugin could be initialized|cannot load library") { throw "The window could not load its Qt plugins." }
        if ($exited) { throw "tsMuxerGUI.exe ended after less than 15 s (exit code $($p.ExitCode))." }
        Write-Host "The ARM64 package passes: every file ARM64, every library found, a job done, the window started."

    - name: Package Build
      run: |
        $ErrorActionPreference = "Stop"
        $ver = $env:GITHUB_REF_NAME -replace '^v',''
        $ver = $ver -replace '[\\/]','-'
        $asset = "tsMuxeR-$ver-windows-arm64.zip"
        Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$asset"
        New-Item -ItemType Directory -Force out | Out-Null
        # zipped by Python, whose names use forward slashes, as 7-Zip writes them for the x64 package
        python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'bin')" "out/$($asset -replace '\.zip$','')"
        if ($LASTEXITCODE -ne 0) { throw "zipping the package failed" }
        # tsMuxeR ships no FFmpeg, nor GStreamer or Qt Multimedia; LICENSE and NOTICE must be there.
        python scripts/check_package.py "out/$asset"
        if ($LASTEXITCODE -ne 0) { throw "The package holds FFmpeg, GStreamer or Qt Multimedia, or lacks LICENSE or NOTICE." }
        # A published asset gets a .sha256 beside it, in the format sha256sum -c reads.
        $hash = (Get-FileHash -Algorithm SHA256 "out\$asset").Hash.ToLower()
        [System.IO.File]::WriteAllText("$PWD\out\$asset.sha256", "$hash  $asset`n")
        Get-Content "out\$asset.sha256"

    - uses: actions/upload-artifact@v6
      with:
        name: tsMuxer-windows-arm64
        path: out/${{ env.ASSET }}
        retention-days: 30
      name: upload-artifact

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/') && env.PUBLISH_ARM64 == 'true'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          out/${{ env.ASSET }}
          out/${{ env.ASSET }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
