name: Build for Linux

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      name: checkout

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype-dev zlib1g-dev
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        modules: 'qtmultimedia'
      
    - name: build-for-linux
      run: ./scripts/rebuild_linux_with_gui.sh

    - name: Package
      run: |
        ver="${GITHUB_REF_NAME#v}"
        asset="tsMuxeR-${ver}-linux-x64.zip"
        echo "ASSET=${asset}" >> "$GITHUB_ENV"
        mkdir -p bin
        # -iname and not -name. The CMake targets are "tsmuxer" and "tsMuxerGUI", find is case
        # sensitive on Linux, so -name tsmuxergui matched nothing and the GUI was left out of every
        # Linux release. Windows never showed it because Test-Path ignores case.
        find build -maxdepth 3 -type f -iname tsmuxer    -exec cp {} bin/tsMuxeR \;
        find build -maxdepth 3 -type f -iname tsmuxergui -exec cp {} bin/tsMuxerGUI \;
        chmod +x bin/tsMuxeR bin/tsMuxerGUI 2>/dev/null || true
        cd bin
        # This job builds with -DTSMUXER_GUI=ON, so a missing GUI is a broken build and not a
        # smaller release. It used to zip the command line tool on its own and say nothing at all.
        for f in tsMuxeR tsMuxerGUI; do
          if [ ! -f "$f" ]; then
            echo "::error::$f was not built. Refusing to publish a partial release."
            exit 1
          fi
        done
        zip -9 "$asset" tsMuxeR tsMuxerGUI
        ls -la

    - uses: actions/upload-artifact@v4
      with:
         name: tsMuxer-linux
         path: bin/${{ env.ASSET }}
      name: upload-artefact

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/${{ env.ASSET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
