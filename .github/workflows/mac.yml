name: Build for Mac

on:
  # Lets a build be run by hand against any branch, from the Actions tab. The zips it
  # attaches are how a tester gets a build without a release existing.
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build-mac-native:

    runs-on: macos-15
    strategy:
      # The two architectures are independent builds and one must not be allowed to kill the
      # other. When Homebrew dropped Intel macOS, the x86_64 leg failed while installing a
      # second Intel Homebrew under Rosetta, and with the default fail-fast that cancelled the
      # arm64 build before it had produced anything. The x86_64 leg now builds freetype itself
      # (scripts/build_macos_native.sh), but a failure in one leg must still not cost the other.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64
    
    steps:
    - uses: actions/checkout@v5
      name: checkout
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        modules: 'qtmultimedia'
      
    - run: ./scripts/build_macos_native.sh
      name: build-for-mac
      env:
        CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}

    - name: Rename zip with architecture
      run: |
        ver="${GITHUB_REF_NAME#v}"
        asset="tsMuxeR-${ver}-macos-${{ matrix.arch }}.zip"
        mv build/bin/mac.zip "build/bin/${asset}"
        echo "ASSET=${asset}" >> "$GITHUB_ENV"

    - name: Checksum the package
      run: |
        # macOS has shasum rather than sha256sum; the output format is the same one sha256sum -c reads.
        cd build/bin
        shasum -a 256 "$ASSET" > "$ASSET.sha256"
        cat "$ASSET.sha256"

    - uses: actions/upload-artifact@v6
      with:
         name: tsMuxer-${{ matrix.arch }}
         path: build/bin/${{ env.ASSET }}
         retention-days: 30
      name: upload-artefact

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          build/bin/${{ env.ASSET }}
          build/bin/${{ env.ASSET }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
